name: flake8
on:
  push:
    branches: ['*']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: |
          pip3 install -r requirements.txt flake8
          flake8 markdown_compiler --extend-ignore=E501
